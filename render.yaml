services:
  - type: web
    name: tj-scheduler
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # One worker so the background checks run exactly once.
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 wsgi:app
    healthCheckPath: /healthz
    disk:
      name: tj-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_TZ
        value: America/Denver
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MAILBOX
        sync: false
      - key: ALLOWED_USER_EMAIL
        sync: false
      - key: SMARTSHEET_TOKEN
        sync: false
      - key: SMARTSHEET_SHEET_ID
        value: "3871787909599108"
